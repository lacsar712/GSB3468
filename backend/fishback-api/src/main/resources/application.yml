server:
  port: 8000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fishback-api
  datasource:
    url: jdbc:mysql://db:3306/fishfrineds?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:fishfrineds}
    password: ${MYSQL_PASSWORD:fishfrineds123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET NAMES utf8mb4"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: fishfrineds-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration: 86400000

logging:
  level:
    root: INFO
    com.fishfrineds: DEBUG
    org.springframework.security: DEBUG
